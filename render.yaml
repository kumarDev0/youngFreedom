# Render blueprint. Import this repo in Render and it wires everything up.
# Every env var marked sync:false must be filled in the Render dashboard —
# they are secrets and must never live in this file.
services:
  - type: web
    name: youngfreedom
    runtime: node
    plan: free              # sleeps after 15 min idle — pair with an external
                             # uptime pinger (e.g. cron-job.org hitting /api/health
                             # every 10 min) so it never actually goes to sleep
    region: singapore      # closest to Bihar
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_POOL_SIZE
        value: "5"   # free plan has only 512 MB RAM — keep the pool small
      - key: APP_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CASHFREE_CLIENT_ID
        sync: false
      - key: CASHFREE_CLIENT_SECRET
        sync: false
      - key: CASHFREE_WEBHOOK_SECRET
        sync: false
      - key: CASHFREE_ENV
        value: SANDBOX        # switch to PRODUCTION once KYC is approved
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false

  # Cron jobs are billed separately from the free web service and may
  # require a paid workspace on some Render plans. If that applies to your
  # account, skip these for now and run both scripts by hand from the
  # web service's Shell tab until the free tier makes sense to leave behind:
  #   node scripts/backup.mjs
  #   node scripts/reconcile.mjs
  - type: cron
    name: yf-nightly-backup
    runtime: node
    plan: starter
    schedule: "0 20 * * *"      # 01:30 IST
    buildCommand: npm install
    startCommand: node scripts/backup.mjs
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: cron
    name: yf-payment-reconcile
    runtime: node
    plan: starter
    schedule: "30 2 * * *"      # 08:00 IST
    buildCommand: npm install
    startCommand: node scripts/reconcile.mjs
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: CASHFREE_CLIENT_ID
        sync: false
      - key: CASHFREE_CLIENT_SECRET
        sync: false
      - key: CASHFREE_ENV
        value: SANDBOX
